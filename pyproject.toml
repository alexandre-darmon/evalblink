[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evalblink"
dynamic = ["version"]
description = "Benchmark LLM prompts × models on your own data — quality and cost in one command, via OpenRouter."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Darmon" }]
requires-python = ">=3.10"
keywords = ["llm", "evaluation", "benchmark", "openrouter", "llm-as-judge", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28",
    "Jinja2>=3.1",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/alexandre-darmon/evalblink"
Issues = "https://github.com/alexandre-darmon/evalblink/issues"

[project.scripts]
evalblink = "evalblink.main:main"

[project.optional-dependencies]
dev = ["ruff>=0.15", "pytest>=8.0"]

[tool.setuptools.dynamic]
version = { attr = "evalblink.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["evalblink*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
