name: Models check

# OpenRouter renames and retires models; fail loudly when a shipped example
# references one that no longer exists. Public endpoint, no secrets.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_models_live.py
        env:
          EVALBLINK_NETWORK_TESTS: "1"
