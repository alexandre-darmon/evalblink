name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check linting
        run: ruff check .
      - name: Check formatting
        run: ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest versions claimed in pyproject classifiers.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  build:
    # The same build and artifact upload as a release (publish.yml).
    uses: ./.github/workflows/build.yml

  package:
    # The wheel users get from PyPI, downloaded like publish.yml does and
    # installed outside the repo.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Check the artifact holds this version's wheel and sdist only
        run: |
          want=$(python -c 'import evalblink; print(evalblink.__version__)')
          ls -l dist/
          test "$(ls dist | sort | tr '\n' ' ')" = "evalblink-$want-py3-none-any.whl evalblink-$want.tar.gz "
      - name: Install the sdist in a clean venv and run its test suite
        run: |
          python -m venv "$RUNNER_TEMP/sdist-venv"
          tar xzf dist/*.tar.gz -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"/evalblink-*/
          "$RUNNER_TEMP/sdist-venv/bin/pip" install ".[dev]"
          "$RUNNER_TEMP/sdist-venv/bin/python" -m pytest -q
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          want=$(cd "$GITHUB_WORKSPACE" && python -c 'import evalblink; print(evalblink.__version__)')
          test "$(/tmp/venv/bin/evalblink --version)" = "$want"
          for f in "${{ github.workspace }}"/benchmarks/*.yaml; do /tmp/venv/bin/evalblink validate "$f"; done
          /tmp/venv/bin/evalblink --help > /dev/null
          /tmp/venv/bin/python -m evalblink --version
          /tmp/venv/bin/evalblink init --yes starter.yaml
          /tmp/venv/bin/evalblink validate starter.yaml
