name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Check linting
        run: ruff check .
      - name: Check formatting
        run: ruff format --check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest versions claimed in pyproject classifiers.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q

  package:
    # The wheel users get from PyPI, installed outside the repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install wheel in a clean venv and smoke-test
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$RUNNER_TEMP"
          want=$(cd "$GITHUB_WORKSPACE" && python -c 'import evalblink; print(evalblink.__version__)')
          test "$(/tmp/venv/bin/evalblink --version)" = "$want"
          for f in "${{ github.workspace }}"/benchmarks/*.yaml; do /tmp/venv/bin/evalblink validate "$f"; done
          /tmp/venv/bin/evalblink --help > /dev/null
          /tmp/venv/bin/python -m evalblink --version
          /tmp/venv/bin/evalblink init --yes starter.yaml
          /tmp/venv/bin/evalblink validate starter.yaml
